name: textcraft

skill_dirs:
  - skills/textcraft            # doc_summary + orchestrator(SYSTEM.md)
  - common_skills/doc_classify  # 从通用 skill 池只引入 doc_classify(叶子目录=逐个指定)

models:
  orchestrator: "deepseek-v4-flash"
  doc_classify: "deepseek-v4-flash"   # doc_classify skill 专用(采样分类,便宜档)
  doc_summary: "deepseek-v4-flash"    # doc_summary skill 专用(摘要质量要求高,可换更强模型)

loop:
  max_iterations: 10
  temperature: 0.3
  max_tokens: 4096
