name: doc_summary
description: "文档摘要:按功能目的型分类生成结构化摘要(长文自动分块),支持按用户要求修订"

tools:
  - name: generate_summary
    handler: handlers.tool_generate_summary
    description: "按文档类型生成结构化摘要。若尚未识别类型会自动做一级兜底分类。长文自动分块处理。调用前必须先让用户上传或粘贴文档。"
    inputs:
      document_text: str
      doc_category: str
      doc_subtype: str
      focus: str
    output: dict

  - name: revise_summary
    handler: handlers.tool_revise_summary
    description: "按用户要求修订已生成的摘要(如'把篇幅压缩到一半''重点补充人物关系')。仅当摘要已存在时调用;文档内容未变化时优先用本工具而不是重新生成。"
    inputs:
      summary: dict
      revision_request: str
      document_text: str
      doc_category: str
    output: dict
